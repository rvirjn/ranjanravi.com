<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="copyright" content="ranjanravi.com">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remedy by Saptarishi</title>
  <link rel="stylesheet" href="../style/styles.css?v=84">
</head>
<body class="saptarishi-page">
  <div id="saptarishi" class="container main-shell">
    <h1>Remedy by Saptarishi</h1>
    <p class="lead">Enter birth details</p>

    <form id="remedy-form" class="search-form kundali-form" autocomplete="off">
      <div class="form-field">
        <label for="place-preset">Place</label>
        <select id="place-preset">
          <option value="">Select place…</option>
          <option value="New Delhi, India">New Delhi, India</option>
          <option value="Mumbai, India">Mumbai, India</option>
          <option value="Kolkata, India">Kolkata, India</option>
          <option value="Bengaluru, India">Bengaluru, India</option>
          <option value="Patna, India">Patna, India</option>
          <option value="Motihari, India">Motihari, India</option>
          <option value="__custom__">Other…</option>
        </select>
      </div>
      <div class="form-field" id="custom-place-wrap" hidden>
        <label for="place-custom">Custom Place</label>
        <input type="text" id="place-custom" maxlength="240" placeholder="City, Country" />
      </div>
      <div class="form-field">
        <label for="birth-date">Date</label>
        <input type="date" id="birth-date" required />
      </div>
      <div class="form-field">
        <label for="birth-time">Time</label>
        <input type="time" id="birth-time" step="1" required />
      </div>
      <div class="form-field form-field--submit">
        <button type="submit" id="submit-btn">Show</button>
      </div>
    </form>
    <p id="status" class="status" role="status" aria-live="polite" hidden></p>

    <div id="results" hidden>
      <h2 class="result-heading">Remedy for</h2>
      <p class="remedy-navatara-hint">Tap a row to see remedy details.</p>
      <div id="navatara-buttons" class="remedy-navatara-buttons" role="group" aria-label="Auspicious nava-tara"></div>
    </div>
  </div>

  <script src="../utils/constants.js?v=40"></script>
  <script src="../js/auth.js?v=10"></script>
  <script src="../js/loading.js?v=1"></script>
  <script src="../js/auth-modal.js?v=6"></script>
  <script src="../js/premium-modal.js?v=2"></script>
  <script src="../js/common.js?v=17"></script>
  <script src="../js/kundali.js?v=127"></script>
  <script src="../js/remedy.js?v=3"></script>
</body>
</html>
