# Clean URLs (/kundali, /auspicious, …). HTML pages use <base href="/frontend/html/">
# so CSS/JS relative paths work while the address bar stays short.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    port_in_redirect off;

    location = / {
        try_files /frontend/html/kundali.html =404;
    }

    location ~ ^/kundali/?$ {
        try_files /frontend/html/kundali.html =404;
    }

    location ~ ^/auspicious/?$ {
        try_files /frontend/html/auspicious.html =404;
    }

    location ~ ^/remedy/?$ {
        try_files /frontend/html/remedy.html =404;
    }

    location ~ ^/profile/?$ {
        try_files /frontend/html/profile.html =404;
    }

    location ~ ^/login/?$ {
        try_files /frontend/html/login.html =404;
    }

    # Legacy bookmarks only (direct request — not used after clean-url try_files)
    location = /frontend/html/kundali.html {
        return 302 /kundali;
    }
    location = /frontend/html/auspicious.html {
        return 302 /auspicious;
    }
    location = /frontend/html/remedy.html {
        return 302 /remedy;
    }
    location = /frontend/html/profile.html {
        return 302 /profile;
    }
    location = /frontend/html/login.html {
        return 302 /login;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
