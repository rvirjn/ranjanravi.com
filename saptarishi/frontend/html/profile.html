  <title>Profile — Saptarishi</title>
  <link rel="stylesheet" href="../style/styles.css?v=320">
</head>
<body class="saptarishi-page">
  <div id="saptarishi" class="container main-shell">

    <p id="profile-status" class="status" role="status" aria-live="polite" hidden></p>

    <div id="profile-summary" class="profile-summary" hidden>
      <div class="profile-summary__grid">
        <div class="profile-summary__left">
          <p id="profile-wallet" class="profile-summary__wallet"></p>
          <p id="profile-plan" class="profile-summary__plan"></p>
          <p id="profile-usage" class="profile-summary__usage"></p>
          <p id="profile-member-since" class="profile-summary__meta"></p>
        </div>
        <div class="profile-summary__right">
          <p id="profile-plans-note" class="paid-plans-note"></p>
          <div class="profile-summary__actions">
            <button type="button" id="profile-add-wallet-btn" class="btn-secondary">Add money to wallet</button>
            <button type="button" id="profile-send-coupon-btn" class="btn-secondary" hidden>Send coupon to users</button>
          </div>
        </div>
      </div>
    </div>

    <form id="profile-form" class="auth-form profile-form" autocomplete="on" novalidate hidden>
      <div class="form-field">
        <label for="profile-name">Full name</label>
        <input type="text" id="profile-name" name="name" autocomplete="name" required maxlength="120" />
      </div>
      <div class="form-field">
        <label for="profile-mobile">Mobile number</label>
        <input type="tel" id="profile-mobile" name="mobile" inputmode="numeric" autocomplete="tel" required placeholder="e.g. 9876543210" />
      </div>
      <div class="form-field">
        <label for="profile-email">Email</label>
        <input type="email" id="profile-email" name="email" autocomplete="email" required maxlength="240" placeholder="you@example.com" />
      </div>
      <div class="form-field form-field--submit">
        <button type="submit">Save changes</button>
      </div>
    </form>

    <section id="profile-security" class="profile-security" hidden>
      <h2 class="profile-security__title">Security</h2>
      <form id="password-form" class="auth-form profile-form" autocomplete="off" novalidate>
        <div class="form-field">
          <label for="profile-current-password">Current password</label>
          <input type="password" id="profile-current-password" name="current-password" autocomplete="current-password" required minlength="4" />
        </div>
        <div class="form-field">
          <label for="profile-new-password">New password</label>
          <input type="password" id="profile-new-password" name="new-password" autocomplete="new-password" required minlength="4" placeholder="At least 4 characters" />
        </div>
        <div class="form-field">
          <label for="profile-confirm-password">Confirm new password</label>
          <input type="password" id="profile-confirm-password" name="confirm-password" autocomplete="new-password" required minlength="4" placeholder="Re-enter new password" />
        </div>
        <div class="form-field form-field--submit">
          <button type="submit">Update password</button>
        </div>
      </form>
      <p id="password-status" class="status" role="status" aria-live="polite" hidden></p>

      <div class="profile-danger" id="delete-account">
        <div class="profile-account-actions">
          <button type="button" id="profile-logout-btn" class="btn-secondary">Logout</button>
          <button type="button" id="profile-delete-start-btn" class="btn-danger">Delete account</button>
        </div>
        <form id="delete-account-form" class="auth-form profile-form" autocomplete="off" novalidate hidden>
          <div class="form-field">
            <label for="profile-delete-password">Confirm with your password</label>
            <input type="password" id="profile-delete-password" name="delete-password" autocomplete="current-password" required minlength="4" />
          </div>
          <div class="form-field form-field--submit">
            <button type="submit" class="btn-danger">Delete my account</button>
          </div>
        </form>
        <p id="delete-status" class="status" role="status" aria-live="polite" hidden></p>
      </div>
    </section>

  </div>

  <div id="send-coupon-overlay" class="send-coupon-overlay" hidden>
    <div class="send-coupon-modal" role="dialog" aria-modal="true" aria-labelledby="send-coupon-title">
      <button type="button" class="send-coupon-modal__close" id="send-coupon-close" aria-label="Close">&times;</button>
      <h2 id="send-coupon-title" class="send-coupon-modal__title">Send coupon to users</h2>
      <p class="send-coupon-modal__lead">Select a user, amount, and unused coupon code.</p>
      <form id="send-coupon-form" class="auth-form send-coupon-form">
        <div class="form-field">
          <label for="send-coupon-name">User name</label>
          <select id="send-coupon-name" required>
            <option value="">Select name…</option>
          </select>
        </div>
        <div class="form-field">
          <label for="send-coupon-email">Email</label>
          <select id="send-coupon-email" required disabled>
            <option value="">Select email…</option>
          </select>
        </div>
        <div class="form-field">
          <label for="send-coupon-amount">Amount</label>
          <select id="send-coupon-amount" required disabled>
            <option value="">Select amount…</option>
          </select>
        </div>
        <div class="form-field">
          <label for="send-coupon-code">Coupon</label>
          <select id="send-coupon-code" required disabled>
            <option value="">Select coupon…</option>
          </select>
        </div>
        <div class="form-field form-field--submit">
          <button type="submit" id="send-coupon-submit">Send coupon email</button>
        </div>
      </form>
      <p id="send-coupon-status" class="status" role="status" aria-live="polite" hidden></p>
    </div>
  </div>

  <script src="../utils/constant.js?v=80"></script>
  <script src="../js/auth.js?v=43"></script>
  <script src="../utils/loading.js?v=2"></script>
  <script src="../js/auth-modal.js?v=24"></script>
  <script src="../js/premium-modal.js?v=13"></script>
  <script src="../js/wallet-modal.js?v=21"></script>
  <script src="../js/profile.js?v=32"></script>
  <script src="../utils/common.js?v=95"></script>
  <script src="../js/ask-ai.js?v=8"></script>
</body>
</html>
