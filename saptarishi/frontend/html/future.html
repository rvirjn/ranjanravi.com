  <script src="../utils/base.js"></script>
  <title>Prediction by Saptarishi</title>
  <link rel="stylesheet" href="../style/styles.css?v=340">
  <link rel="stylesheet" href="../style/future.css?v=12">
</head>
<body class="saptarishi-page">
  <div id="saptarishi" class="container main-shell">

    <section id="future-options-view" class="auspicious-view" aria-label="Prediction options">
      <div class="auspicious-grid future-grid" role="list" aria-label="Prediction topics">
        <button class="feature-tile" type="button" data-event="career" role="listitem">
          <span class="feature-tile__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="7.4" cy="5" r="1.65"/><path d="M6.6 6.8 8.2 11.4l3.4 1"/><path d="M8.2 11.4 6.4 16.6"/><path d="M6.8 8.4 10.4 7"/><path d="M4 20h5.4v-4h4.2v-4h4.2V8H20"/></svg></span>
          <strong>Career</strong>
        </button>
        <button class="feature-tile" type="button" data-event="marriage" role="listitem">
          <span class="feature-tile__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 19.5S5.5 14.8 5.5 10.2A3.5 3.5 0 0 1 12 8.2a3.5 3.5 0 0 1 6.5 2c0 4.6-6.5 9.3-6.5 9.3z"/></svg></span>
          <strong>Marriage</strong>
        </button>
        <button class="feature-tile" type="button" data-event="child" role="listitem">
          <span class="feature-tile__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="2.6"/><path d="M7.5 19c.8-3.2 2.4-4.8 4.5-4.8s3.7 1.6 4.5 4.8"/><path d="M16.8 7.2c1.7.4 2.9 1.7 2.9 3.4 0 2.4-2.4 4-4.2 5.1"/><path d="M7.2 7.2C5.5 7.6 4.3 8.9 4.3 10.6c0 2.4 2.4 4 4.2 5.1"/></svg></span>
          <strong>Child born</strong>
        </button>
      </div>
    </section>

    <section id="future-detail-view" class="auspicious-view" hidden aria-label="Prediction birth details">
      <nav class="topic-crumb" aria-label="Prediction">
        <button type="button" id="future-back-btn" class="auspicious-back">← Prediction</button>
        <span class="topic-crumb__current">← <span id="future-selected-title">Career</span></span>
      </nav>
      <p class="lead future-detail-lead">Enter birth details to find favourable dasha windows.</p>

      <div class="kundali-tabs" role="tablist" aria-label="Birth details options">
        <button
          type="button"
          class="kundali-tabs__item"
          id="tab-open-birth"
          role="tab"
          aria-selected="false"
          data-birth-mode="open"
        >
          Open birth details
        </button>
        <button
          type="button"
          class="kundali-tabs__item kundali-tabs__item--active"
          id="tab-new-birth"
          role="tab"
          aria-selected="true"
          data-birth-mode="new"
        >
          New birth details
        </button>
      </div>

      <form id="future-form" class="search-form kundali-form" autocomplete="off" novalidate>
        <div class="form-field birth-open-list-wrap" id="open-birth-wrap" hidden>
          <label class="birth-open-search-label" for="saved-birth-search">Search saved births</label>
          <input
            type="search"
            id="saved-birth-search"
            class="birth-open-search"
            placeholder="Search by name, place, or date…"
            autocomplete="off"
            enterkeyhint="search"
            aria-label="Search saved birth details"
          />
          <select id="saved-birth-select" hidden aria-hidden="true">
            <option value="">Select saved name…</option>
          </select>
          <div id="saved-birth-list" class="birth-open-list" role="listbox" aria-label="Saved birth details"></div>
          <p id="open-birth-status" class="status" role="status" aria-live="polite" hidden></p>
        </div>
        <div id="new-birth-fields">
        <div class="form-field" id="birth-name-wrap">
          <label for="birth-name">Name</label>
          <input type="text" id="birth-name" maxlength="120" placeholder="Enter Name" aria-label="Name" />
        </div>
        <div class="form-field">
          <label for="place-preset">Place</label>
          <select id="place-preset">
            <option value="">Select Place…</option>
            <option value="__custom__">Other…</option>
          </select>
        </div>
        <div class="form-field" id="custom-place-wrap" hidden>
          <label for="place-custom">Custom Place</label>
          <input type="text" id="place-custom" maxlength="240" placeholder="Type city and country." />
        </div>
        <div class="form-field">
          <label for="birth-date">Date</label>
          <input type="date" id="birth-date" required />
        </div>
        <div class="form-field">
          <label for="birth-time">Time</label>
          <input type="time" id="birth-time" step="1" required />
        </div>
        <div class="form-field form-field--save" id="save-birth-wrap">
          <label class="save-birth-label" for="save-birth">
            <input type="checkbox" id="save-birth" class="save-birth-check" checked>
            Save
          </label>
        </div>
        <div class="form-field form-field--submit">
          <button type="submit" id="submit-btn">Show</button>
        </div>
        </div>
      </form>

      <p id="status" class="status" role="status" aria-live="polite" hidden></p>

      <div id="results" hidden>
        <section id="planet-active-dasha-section" class="kundali-yog-section planet-active-dasha-section" hidden>
          <div class="planet-active-dasha-header">
            <h2 id="planet-active-dasha-heading" class="result-heading">Your Dasha</h2>
            <button
              type="button"
              id="planet-active-dasha-info-btn"
              class="kundali-info-btn"
              data-qa-key="your_dasha"
              aria-label="What is Dasha?"
              aria-expanded="false"
              aria-controls="kundali-qa-popover"
              title="What is Dasha?"
              hidden
            >
              <span class="kundali-info-btn__glyph" aria-hidden="true">i</span>
            </button>
          </div>
          <div id="current-dasha-summary" class="current-dasha-summary" aria-label="Your dasha"></div>
        </section>
        <p id="future-disclaimer" class="future-disclaimer lead"></p>
        <article id="future-best" class="future-best" hidden></article>
        <section id="future-windows-section" hidden>
          <h2 class="result-heading">Top 3 dasha timings</h2>
          <div id="future-windows" class="future-windows"></div>
        </section>
      </div>
    </section>
  </div>

  <script src="../utils/constant.js?v=85"></script>
  <script src="../js/auth.js?v=50"></script>
  <script src="../utils/loading.js?v=2"></script>
  <script src="../js/auth-modal.js?v=27"></script>
  <script src="../js/premium-modal.js?v=13"></script>
  <script src="../js/wallet-modal.js?v=22"></script>
  <script src="../utils/common.js?v=105"></script>
  <script src="../js/ask-ai.js?v=17"></script>
  <script src="../js/kundali.js?v=355"></script>
  <script src="../js/future.js?v=9"></script>
</body>
</html>
