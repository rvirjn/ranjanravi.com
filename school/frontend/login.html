<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1b4d2b">
  <title>Login | RV Smart School (ERP)</title>
  <link rel="icon" type="image/png" sizes="32x32" href="image/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="image/favicon-192.png">
  <link rel="apple-touch-icon" href="image/favicon-192.png">
  <link rel="stylesheet" href="vendor/font-awesome/css/font-awesome.min.css">
  <link rel="stylesheet" href="css/portal.css?v=20261029n">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-head">
        <div class="logo"><img src="image/campus-badge.png" alt="RV Smart School ERP"></div>
        <h1>RV Smart School (ERP)</h1>
        <p>Login with your User ID</p>
      </div>
      <div class="login-body">
        <form id="loginForm">
          <div class="form-error" id="error" hidden></div>
          <div class="form-ok" id="notice" hidden></div>
          <div class="field">
            <label for="login_id">User ID</label>
            <input id="login_id" name="login_id" required autocomplete="username" autocapitalize="characters">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required autocomplete="current-password">
          </div>
          <button class="btn btn-block" type="submit" id="submitBtn"><i class="fa fa-sign-in"></i> Login</button>
        </form>

        <form id="forgotForm" hidden>
          <p class="muted small">Enter your User ID. If an email is registered, a temporary password will be sent to it.</p>
          <div class="form-ok" id="forgotMsg" hidden></div>
          <div class="field">
            <label for="forgot_id">User ID</label>
            <input id="forgot_id" name="login_id" required autocapitalize="characters">
          </div>
          <button class="btn btn-block" type="submit"><i class="fa fa-envelope-o"></i> Send Temporary Password</button>
        </form>

        <div class="login-links">
          <a href="#" id="forgotLink">Forgot password?</a>
          <a href="about.html">About &amp; Features</a>
          <a href="privacy-policy.html">Privacy Policy</a>
        </div>
        <div class="login-apk" id="apkDownload">
          <a class="btn btn-light btn-block" href="download/RV-Smart-School-ERP.apk" download="RV-Smart-School-ERP.apk">
            <i class="fa fa-android"></i> Download Android app
          </a>
          <p class="muted">RV-Smart-School-ERP.apk · version 1.0.0</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js?v=20261029m"></script>
  <script src="js/api.js?v=20261029d"></script>
  <script src="js/i18n.js?v=20261029m"></script>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);

      if (navigator.userAgent.indexOf("MPSPortalApp") !== -1) {
        document.getElementById("apkDownload").hidden = true;
      }

      const existing = MPS.session();
      if (existing && existing.token && existing.home && !params.get("expired")) {
        location.replace(existing.home);
        return;
      }

      const error = document.getElementById("error");
      if (params.get("expired")) {
        const notice = document.getElementById("notice");
        notice.textContent = "Your session has ended. Please log in again.";
        notice.hidden = false;
      }

      const loginForm = document.getElementById("loginForm");
      const submitBtn = document.getElementById("submitBtn");
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        error.hidden = true;
        submitBtn.disabled = true;
        try {
          const data = Object.fromEntries(new FormData(loginForm).entries());
          const result = await MPS.post("/auth/login", data);
          MPS.saveSession({ token: result.token, role: result.role, home: result.home, user: result.user, school: result.school });
          location.replace(result.home);
        } catch (err) {
          error.textContent = err.message;
          error.hidden = false;
          submitBtn.disabled = false;
        }
      });

      const forgotForm = document.getElementById("forgotForm");
      const forgotLink = document.getElementById("forgotLink");
      forgotLink.addEventListener("click", (e) => {
        e.preventDefault();
        const showForgot = forgotForm.hidden;
        forgotForm.hidden = !showForgot;
        loginForm.hidden = showForgot;
        forgotLink.textContent = showForgot ? "Back to login" : "Forgot password?";
      });
      forgotForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const msg = document.getElementById("forgotMsg");
        try {
          const result = await MPS.post("/auth/password/forgot", { login_id: document.getElementById("forgot_id").value });
          msg.textContent = result.message;
        } catch (err) {
          msg.textContent = err.message;
        }
        msg.hidden = false;
      });
    })();
  </script>
</body>
</html>
